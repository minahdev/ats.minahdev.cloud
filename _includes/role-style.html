{%- comment -%}
역할 상세 페이지(/role-*/) 공통 스타일.
담당자 색(.who-a ~ .who-e)은 개발 일정 페이지의 역할표·칸반과 같은 값을 쓴다 —
한 사람이 사이트 어디에 나와도 같은 색으로 보이게 하기 위함이다.
{%- endcomment -%}
<style>
.role { max-width: 62rem; margin: 2.5rem auto 4rem; }

.role__head { border-bottom: 2px solid #111827; padding-bottom: 1rem; margin-bottom: 1.6rem; }
.role__crumb { margin: 0 0 .5rem; font-size: .82rem; color: #9ca3af; }
.role__crumb a { color: #9ca3af; }
.role__head h1 { font-size: 1.9rem; margin: 0 0 .5rem; letter-spacing: -.01em; word-break: keep-all; }
.role__head p { margin: 0; color: #6b7280; font-size: .9rem; word-break: keep-all; }

/* 담당자 색 — 사이트 전체에서 사람마다 고정이다 */
.who {
  display: inline-block;
  padding: .06rem .4rem;
  border-radius: 3px;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
}
.who-a { background: #e0e7ff; color: #3730a3; }
.who-b { background: #d1fae5; color: #065f46; }
.who-c { background: #fce7f3; color: #9d174d; }
.who-d { background: #fef3c7; color: #92400e; }
.who-e { background: #e0f2fe; color: #075985; }

.role__stat {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
  gap: .6rem;
  margin-bottom: 2.75rem;
}
.stat { border: 1px solid #e5e7eb; border-radius: 6px; padding: .7rem .85rem; }
.stat__k { display: block; font-size: .72rem; color: #9ca3af; letter-spacing: .03em; margin-bottom: .25rem; }
.stat__v { font-size: 1.05rem; font-weight: 700; color: #111827; word-break: keep-all; }
.stat__v small { font-size: .78rem; font-weight: 400; color: #9ca3af; margin-left: .15rem; }
.stat__v code { font-size: .9rem; background: none; padding: 0; }

.role__sec { margin-bottom: 3.25rem; }
.role__sec > h2 {
  font-size: 1.05rem;
  color: #2a7ae2;
  margin: 0 0 1.1rem;
  padding-bottom: .5rem;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  gap: .5rem;
  align-items: baseline;
  word-break: keep-all;
}
.role__num { font-variant-numeric: tabular-nums; font-weight: 700; }
.role__note { margin: -.4rem 0 1.2rem; color: #6b7280; font-size: .88rem; line-height: 1.7; word-break: keep-all; }
.role__p { margin: 0 0 1rem; color: #374151; font-size: .92rem; line-height: 1.8; word-break: keep-all; }
.role__p:last-child { margin-bottom: 0; }
.role__p code, .role__note code { font-size: .84rem; background: #f3f4f6; padding: .05rem .3rem; border-radius: 3px; }

/* 포함 / 제외 2단 */
.scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: .75rem; }
.scope__box { border: 1px solid #e5e7eb; border-radius: 6px; padding: .9rem 1rem; }
.scope__box--in { background: #f0fdf4; border-color: #bbf7d0; }
.scope__box--out { background: #f9fafb; }
.scope__box h3 { margin: 0 0 .6rem; font-size: .9rem; color: #111827; }
.scope__box ul { margin: 0; padding-left: 1.1rem; }
.scope__box li { font-size: .86rem; line-height: 1.75; color: #374151; word-break: keep-all; }
.scope__box--out li { color: #6b7280; }
.scope__box code { font-size: .8rem; background: rgba(0, 0, 0, .045); padding: .05rem .3rem; border-radius: 3px; }

/* 표 공통 */
.tbl__scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 46rem; }
.tbl th {
  background: #f9fafb;
  text-align: left;
  padding: .65rem .8rem;
  font-size: .76rem;
  color: #6b7280;
  letter-spacing: .03em;
  border-bottom: 1px solid #e5e7eb;
  white-space: nowrap;
}
.tbl td {
  padding: .65rem .8rem;
  border-bottom: 1px solid #f3f4f6;
  vertical-align: top;
  color: #374151;
  line-height: 1.7;
  word-break: keep-all;
}
.tbl__wk { white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl__wk b { display: block; font-size: .92rem; color: #111827; font-weight: 700; }
.tbl__wk span { font-size: .74rem; color: #9ca3af; }
.tbl tr.is-now td { background: #eff6ff; }
.tbl tr.is-done td { color: #9ca3af; }
.tbl tr.is-done .tbl__wk b { color: #9ca3af; }
.tbl code { font-size: .82rem; background: #f3f4f6; padding: .05rem .3rem; border-radius: 3px; }
.tbl__num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.tag {
  display: inline-block;
  padding: .04rem .38rem;
  border-radius: 3px;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
  vertical-align: .05em;
}
.tag--done { background: #d1fae5; color: #065f46; }
.tag--now  { background: #dbeafe; color: #1e40af; }
.tag--wait { background: #f3f4f6; color: #6b7280; }
.tag--miss { background: #fef3c7; color: #92400e; }
.tag--gate { background: #fee2e2; color: #991b1b; }

/* 카드형 항목 (리스크·결정·확인 사항) */
.items { display: grid; gap: .7rem; }
.item { border: 1px solid #e5e7eb; border-radius: 6px; padding: .85rem 1rem; }
.item__t { margin: 0 0 .35rem; font-size: .92rem; font-weight: 600; color: #111827; word-break: keep-all; }
.item__t code { font-size: .85rem; background: #f3f4f6; padding: .05rem .3rem; border-radius: 3px; font-weight: 400; }
.item__d { margin: 0; font-size: .86rem; line-height: 1.75; color: #6b7280; word-break: keep-all; }
.item__d code { font-size: .8rem; background: #f3f4f6; padding: .05rem .3rem; border-radius: 3px; }

/* 발표 포인트 */
.talk { margin: 0; padding-left: 1.15rem; }
.talk li { font-size: .9rem; line-height: 1.8; color: #374151; margin-bottom: .5rem; word-break: keep-all; }
.talk li:last-child { margin-bottom: 0; }

.role__back { display: inline-block; margin-top: 1rem; font-size: .9rem; }

@media (max-width: 34rem) {
  .role__stat { grid-template-columns: repeat(2, 1fr); }
}
</style>
