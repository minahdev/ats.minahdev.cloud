# 상단 헤더와 푸터에 표시되는 이름. 팀명(seuk)이 아니라 프로젝트명을 쓴다.
title: AI 채용 자동화 플랫폼
description: >-
  AI 기반 채용 프로세스 자동화 및 지원자 통합 관리 플랫폼 구축을 위한 개발 보고서.
  개발 기간 2026년 8월 20일 ~ 10월 27일.

# 푸터의 깃허브 링크. email을 추가하면 푸터에 메일 주소가 공개되므로 넣지 않았다.
github_username: minahdev

# 커스텀 도메인 ats.minahdev.cloud로 서빙된다(2026-09-22). 사이트가 도메인 루트에
# 있으므로 baseurl은 비운다. 리포 이름 경로(/ats.minahdev.cloud)를 다시 넣으면
# CSS와 내부 링크가 전부 404가 난다. 도메인 설정은 루트의 CNAME 파일이 들고 있다.
baseurl: ""
url: "https://ats.minahdev.cloud"

theme: minima
plugins:
  - jekyll-feed

# 상단 네비게이션에 노출할 페이지와 그 순서.
# index.md는 넣지 않는다 — 좌측 사이트 제목이 이미 표지로 가는 링크다.
header_pages:
  - toc.md
  - team.md
  - schedule.md
  - log.md
  - todo.md

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - CLAUDE.md
  - README.md
