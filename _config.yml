# 상단 헤더와 푸터에 표시되는 이름. 팀명(seuk)이 아니라 프로젝트명을 쓴다.
title: AI 채용 자동화 플랫폼
description: >-
  AI 기반 채용 프로세스 자동화 및 지원자 통합 관리 플랫폼 구축을 위한 개발 보고서.
  개발 기간 2026년 8월 20일 ~ 10월 27일.

# 푸터의 깃허브 링크. email을 추가하면 푸터에 메일 주소가 공개되므로 넣지 않았다.
github_username: minahdev

# 지금은 프로젝트 페이지(minahdev.github.io/ats.minahdev.cloud/)로 서빙되므로
# baseurl에 리포 이름 경로가 필요하다. 커스텀 도메인 ats.minahdev.cloud를 붙이면
# baseurl은 ""로, url은 "https://ats.minahdev.cloud"로 바꿔야 한다.
baseurl: "/ats.minahdev.cloud"
url: "https://minahdev.github.io"

theme: minima
plugins:
  - jekyll-feed

# 상단 네비게이션에 노출할 페이지와 그 순서.
# index.md는 넣지 않는다 — 좌측 사이트 제목이 이미 표지로 가는 링크다.
header_pages:
  - toc.md
  - schedule.md
  - log.md
  - todo.md

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - CLAUDE.md
  - README.md
